name: Safeguarding Forecast AI — CI & Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Python ML & FastAPI Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system OpenMP runtime for LightGBM
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run automated pytest suite
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/ -v

  frontend-build:
    name: React TypeScript & Vite Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build production bundle
        working-directory: frontend
        run: npm run build

  deploy-vercel:
    name: Deploy Prebuilt Bundle to Vercel
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_OSVaVFUwZWrLYczeCOC7I2UY' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_T5wyFebbhez4KdK18cZ82nm4Iljs' }}
    steps:
      - name: Checkout repository
        if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@48.12.1

      - name: Pull Vercel Production Environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production

      - name: Build Project Artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod

      - name: Deploy Prebuilt Output to Vercel Production
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --yes

      - name: Skip notice when VERCEL_TOKEN secret is not configured
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "Tests and build succeeded. To enable automated Vercel CLI deployment from GitHub Actions, add VERCEL_TOKEN to repository secrets."
